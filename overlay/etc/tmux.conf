# hos: the default tmux config, sourced before ~/.config/tmux/tmux.conf.
# Override or extend it there.

set -g allow-passthrough on
set -g extended-keys on
set -g extended-keys-format csi-u
unbind C-b
set -g prefix C-space
bind C-space send-prefix

set -g status off
set -g base-index 1              # windows start at 1
set -g detach-on-destroy off     # closing a session switches, not exits
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
set -g default-terminal "${TERM}"
set -g mouse on
setw -g mode-keys vi
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# modes, panes, status bar, messages
setw -g clock-mode-colour colour5
setw -g mode-style 'fg=colour1 bg=colour18 bold'
set -g pane-border-style 'fg=colour30 bg=default'
set -g pane-active-border-style 'fg=colour30 bg=default'
set -g status-justify left
set -g status-style 'bg=colour236 fg=colour137 dim'
set -g status-left ''
set -g status-right '#[fg=colour233,bg=236] %d/%m #[fg=colour233,bg=colour8] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20
setw -g window-status-current-style 'fg=colour233 bg=colour8 bold'
setw -g window-status-current-format ' #I#[fg=colour249]:#[fg=colour255]#W#[fg=colour249]#F '
setw -g window-status-style 'fg=colour9 bg=colour235'
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
setw -g window-status-bell-style 'fg=colour255 bg=colour1 bold'
set -g message-style 'fg=colour17 bg=colour3 bold'

# splits and windows follow the current path
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind e new-window yazi
bind m popup -d "#{pane_current_path}"
bind r source-file /etc/tmux.conf
bind C-c new-session -c "#{pane_current_path}"
bind -n C-t set status
bind x kill-pane

# C-hjkl moves between panes, passed through to a running editor
is_editor="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?(hed|g?(view|n?vim?x?)(diff)?)$'"
bind -n 'C-h' if-shell "$is_editor" 'send-keys C-h' 'select-pane -L'
bind -n 'C-j' if-shell "$is_editor" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if-shell "$is_editor" 'send-keys C-k' 'select-pane -U'
bind -n 'C-l' if-shell "$is_editor" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_editor" 'send-keys C-\\' 'select-pane -l'
bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

# M-hjkl resizes
bind -n 'M-k' resize-pane -U 5
bind -n 'M-j' resize-pane -D 5
bind -n 'M-h' resize-pane -L 5
bind -n 'M-l' resize-pane -R 5

# vi copy mode into the X clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
