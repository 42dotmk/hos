# Build the hos ISO and publish it as a GitHub release; build the hackable
# tools as xbps packages, sign them and publish the repository to GitHub
# Pages (https://42dotmk.github.io/hos, what /etc/xbps.d on the ISO names).
#
# Runs as root in Void's own container (privileged: mkrootfs bind-mounts
# /dev, /proc and /sys into the rootfs for the package hooks, which
# chroot). Every sibling project is cloned from github.com/42dotmk — all
# of them must be pushed there; fonts and backgrounds are vendored in this
# repo. The version is the latest v* tag bumped (patch by default;
# workflow_dispatch can pick minor/major), and the release is created with
# that tag on the built commit. The repository signature needs the
# XBPS_PRIVKEY secret: the private half of hos-repo.pub (PEM); Pages must
# be set to deploy from GitHub Actions.
name: iso

on:
  workflow_dispatch:
    inputs:
      bump:
        description: version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: iso
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ORG: 42dotmk
  GH_TOKEN: ${{ github.token }}

jobs:
  iso:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged
      volumes:
        - /dev:/dev
    defaults:
      run:
        shell: bash -e {0}  # the container's sh is dash
    steps:
      # the image has no bash: this one step runs under its sh and installs it
      - name: Prepare container
        shell: sh -e {0}
        run: |
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y bash git rsync python3 curl tar xz github-cli \
            cpio zstd squashfs-tools grub grub-x86_64-efi xorriso mtools
          git config --global --add safe.directory '*'

      - name: Clone hos
        run: |
          git clone "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" checkout "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" fetch --tags

      # what PACKAGES lists is by definition what rebuilding every tool needs
      - name: Install build dependencies
        run: xbps-install -y $(grep -v '^#' PACKAGES | tr '\n' ' ')

      # a project not (yet) on github is left out of this build, loudly
      - name: Clone the hackable tools
        run: |
          projects=
          for p in $(make -s print-projects); do
            if git clone --recurse-submodules --shallow-submodules \
                "https://github.com/$ORG/$p" "../$p"; then
              projects="$projects $p"
            else
              echo "::warning::$ORG/$p: clone failed, left out of this build"
            fi
          done
          echo "PROJECTS=${projects# }" | tee -a "$GITHUB_ENV"

      - name: Pick the version
        run: |
          last=$(git tag -l 'v*' --sort=-v:refname | head -1)
          IFS=. read -r M m p <<< "${last#v}"
          : "${M:=0}" "${m:=0}" "${p:=0}"
          case "${{ inputs.bump || 'patch' }}" in
            major) M=$((M + 1)); m=0; p=0 ;;
            minor) m=$((m + 1)); p=0 ;;
            *)     p=$((p + 1)) ;;
          esac
          echo "VERSION=v$M.$m.$p" | tee -a "$GITHUB_ENV"

      - name: Build the ISO
        run: make iso VERSION="$VERSION"

      - name: Sign the package repository
        env:
          XBPS_PRIVKEY: ${{ secrets.XBPS_PRIVKEY }}
        run: |
          test -n "$XBPS_PRIVKEY" || { echo "::error::no XBPS_PRIVKEY secret, the repository would be unsigned"; exit 1; }
          umask 077; printf '%s\n' "$XBPS_PRIVKEY" > /tmp/key.pem
          make sign KEY=/tmp/key.pem
          rm -f /tmp/key.pem
          cp pages/index.html build/repo/
          ls -l build/repo

      - name: Upload the repository for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/repo

      - name: Release
        run: |
          iso="hos-$VERSION-x86_64.iso"
          sha256sum "$iso" > "$iso.sha256"
          gh release create "$VERSION" "$iso" "$iso.sha256" \
            --target "$GITHUB_SHA" --title "hos $VERSION" --generate-notes

  pages:
    needs: iso
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
